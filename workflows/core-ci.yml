name: Savior Systems Core Infrastructure Pipeline

on:
  workflow_call:
    inputs:
      node_version:
        description: Target Node.js version for the execution environment
        required: false
        type: string
        default: 20.x

jobs:
  security-audit:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute Gitleaks Risk Assessment
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  code-integrity:
    name: Static Analysis & Type Checking
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Resolve Dependencies
        run: npm ci

      - name: Enforce Strict Linting
        run: npm run lint --if-present

      - name: Compile & Type Check
        run: npx tsc --noEmit --if-present